[package]
name = "misorder"
description = "Deterministic simulation testing for services with real dependencies: seeded faults, replayable traces, and failures shrunk to a minimal reproducer."
keywords = ["testing", "deterministic", "chaos", "simulation", "fuzzing"]
categories = ["development-tools::testing", "network-programming", "asynchronous"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "misorder"
path = "src/lib.rs"

[lints]
workspace = true

# Builds every feature on docs.rs, so the documentation matches the crate rather
# than its default build.
[package.metadata.docs.rs]
all-features = true

# One feature per protocol, and every one of them on by default.
#
# The axis exists so a contributor can add an adapter without touching anything
# else, and so a downstream embedder can drop the client libraries it does not
# need. It is explicitly NOT a boundary of any other kind: gating an adapter
# kills the community contribution that is the only way the long tail of
# vendors ever gets covered.
[features]
default = ["nats", "postgres", "redis", "http"]
nats = ["dep:async-nats"]
postgres = ["dep:tokio-postgres"]
# No client library. A proxy speaks the wire protocol itself, and RESP is
# small enough that a dependency here would buy a type for a value this
# adapter never constructs.
redis = []
http = []

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

rand = { workspace = true }
rand_chacha = { workspace = true }

bollard = { workspace = true }
bytes = { workspace = true }

blake3 = { workspace = true }
chrono = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
humantime-serde = { workspace = true }

async-nats = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
