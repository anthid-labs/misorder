name: 🔐 static security analysis

# Runs on every pull request and again on main after the merge. The two runs
# are not redundant: the PR run scans the merge preview, and the main run is
# the one that scans what actually shipped, including anything that landed
# through a bypass or a stale-base merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: SAST (Semgrep)

    runs-on: ubuntu-latest

    # The engine is pinned so a rule-engine release cannot turn a green branch
    # red on its own. The rule packs are still fetched from the registry on
    # every run, so pinning the image does not freeze coverage.
    container:
      image: semgrep/semgrep:1.172.0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Semgrep
        # `--error` is deliberately not passed: it exits non-zero on *any*
        # finding, INFO included. Gating happens in the next step instead, so
        # a low-severity note lands in the summary without blocking a branch.
        run: |
          semgrep scan \
            --config p/rust \
            --config p/security-audit \
            --config p/secrets \
            --metrics=off \
            --quiet \
            --json --output semgrep.json \
            .

      - name: Report findings and gate on ERROR
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, sys

          try:
              with open("semgrep.json") as fh:
                  results = json.load(fh).get("results", [])
          except (OSError, ValueError) as exc:
              print("### SAST (Semgrep)\n")
              print(f"Scan produced no readable report: `{exc}`")
              sys.exit(1)

          order = {"ERROR": 0, "WARNING": 1, "INFO": 2}
          results.sort(key=lambda r: order.get(r["extra"].get("severity"), 3))
          blocking = [r for r in results if r["extra"].get("severity") == "ERROR"]

          print("### SAST (Semgrep)\n")
          if not results:
              print("No findings.")
              sys.exit(0)

          print(f"{len(results)} finding(s), {len(blocking)} blocking.\n")
          print("| Severity | Rule | Location |")
          print("| --- | --- | --- |")
          for r in results:
              rule = r["check_id"].rsplit(".", 1)[-1]
              loc = f'{r["path"]}:{r["start"]["line"]}'
              print(f'| {r["extra"].get("severity")} | `{rule}` | `{loc}` |')

          if blocking:
              print("\nFailing: ERROR-severity findings must be fixed or "
                    "explicitly ignored with a `nosemgrep` comment.")
          sys.exit(1 if blocking else 0)
          PY

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-report
          path: semgrep.json
          if-no-files-found: warn
          retention-days: 30

  dependencies:
    name: Dependency advisories (cargo audit)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        # Audits the workspace `Cargo.lock`, so this covers every service, not
        # just the one that triggered the run. Unmaintained/unsound advisories
        # are reported but do not fail the job; add `--deny warnings` to gate
        # on those too.
        run: |
          set +e
          cargo audit --color never > audit.txt 2>&1
          status=$?
          set -e

          {
            echo '### Dependency advisories (cargo audit)'
            echo
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-audit-report
          path: audit.txt
          if-no-files-found: warn
          retention-days: 30
