name: "🏗️ Build and Push Docker Image"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Named from the owner rather than the repository, so the image keeps its name
  # if the repository is renamed.
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/misorder

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy (all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Hermetic: no Docker, no network. Anything that needs a real container
      # lives behind a non-default feature or in docker/, so this stays fast
      # enough to run on every push.
      - name: Run tests
        run: cargo test --workspace

      # One feature per protocol, and a downstream embedder may enable exactly
      # one. A missing `#[cfg]` compiles fine with the default set and fails
      # only for the person who turned the others off, which is the worst place
      # to find it.
      #
      # `test` rather than `check`, because compiling is the weaker half. A test
      # that assumes every adapter is present passes with the default set and
      # fails for exactly the person this step exists for, and checking alone
      # never compiles the tests at all.
      - name: Test each protocol feature alone
        run: |
          set -euo pipefail
          cargo test -p misorder --no-default-features --lib
          for feature in nats postgres http; do
            echo "::group::misorder --features $feature"
            cargo test -p misorder --no-default-features --features "$feature" --lib
            echo "::endgroup::"
          done

  prepare:
    name: Prepare Docker build context
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Nothing downstream of here runs for a pull request, so the tag derivation
    # is skipped too rather than computing tags no job will use.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - id: tag
        run: |
          sha_tag="$(echo "${{ steps.meta.outputs.tags }}" | grep -E ':(sha-[0-9a-f]+)$' | head -n1 | sed 's/.*://')"
          echo "image_tag=${sha_tag}" >> "$GITHUB_OUTPUT"

    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      image_tag: ${{ steps.tag.outputs.image_tag }}

  build-and-push-arm:
    name: Build and push Docker image (Arm64)
    # GitHub's hosted ARM runner. Native, so no emulation: a cross-build under
    # QEMU measured ~30x slower than native for this project.
    runs-on: ubuntu-24.04-arm
    needs: prepare
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Derive Arm64 tags
        id: arch-tags
        run: |
          {
            echo "tags<<EOF"
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              echo "${tag}-arm64"
            done <<< "${{ needs.prepare.outputs.tags }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.arch-tags.outputs.tags }}
          labels: ${{ needs.prepare.outputs.labels }}

  build-and-push-amd64:
    name: Build and push Docker image (Amd64)
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Derive Amd64 tags
        id: arch-tags
        run: |
          {
            echo "tags<<EOF"
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              echo "${tag}-amd64"
            done <<< "${{ needs.prepare.outputs.tags }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.arch-tags.outputs.tags }}
          labels: ${{ needs.prepare.outputs.labels }}

  container-scan:
    name: Scan image
    # Runs against the amd64 arch tag rather than the merged manifest, because
    # that tag exists before the manifest does. Scanning here is what lets a
    # vulnerable build stop short of `latest`: the arch tags are intermediate,
    # but the manifest below is what anyone actually pulls.
    #
    # Only amd64 is scanned. Both arches install the same apk set on the same
    # base, so the package surface Trivy reports is the same one; a per-arch
    # difference would have to come from the base image itself.
    needs:
      - prepare
      - build-and-push-amd64
    uses: ./.github/workflows/container-scan.yml
    with:
      image_repository: ghcr.io/${{ github.repository_owner }}/misorder
      image_tag: ${{ needs.prepare.outputs.image_tag }}-amd64

  merge-manifests:
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-and-push-arm
      - build-and-push-amd64
      - container-scan
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create \
              --tag "$tag" \
              "${tag}-arm64" \
              "${tag}-amd64"
          done <<< "${{ needs.prepare.outputs.tags }}"

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Last, and only after the image is out. A failed build, a failed test or a
    # vulnerable image should not produce a release on crates.io, and a publish
    # cannot be taken back: a version number is burned even if the crate is
    # yanked a minute later.
    needs:
      - lint-and-test
      - merge-manifests
    # Never from a pull request, and never from a branch. A fork opening a PR
    # would otherwise reach a job holding the publish token.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish any version that is not on crates.io yet
        env:
          # Read by cargo directly, so the token never appears in a command
          # line where `ps` would show it.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; nothing to publish with." >&2
            exit 1
          fi

          version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "misorder") | .version')"
          echo "Workspace version: $version"

          # 200 when this exact version exists on crates.io, 404 when it does
          # not. Anything else is the registry being unavailable, which must not
          # read as "not published" and cause a duplicate publish attempt.
          crate_status() {
            curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: misorder-ci (github actions)' \
              "https://crates.io/api/v1/crates/$1/$2"
          }

          already_published() {
            local status
            status="$(crate_status "$1" "$2")"

            case "$status" in
              200) return 0 ;;
              404) return 1 ;;
              *)
                echo "crates.io returned $status for $1 $2; refusing to guess." >&2
                exit 1
                ;;
            esac
          }

          # `cargo publish` waits for its own crate to land in the index, but
          # the dependent crate's verification build resolves `misorder` from
          # the registry, so confirm it is really there before moving on.
          wait_until_available() {
            for _ in $(seq 1 60); do
              if already_published "$1" "$2"; then
                return 0
              fi
              sleep 5
            done

            echo "timed out waiting for $1 $2 to appear on crates.io" >&2
            exit 1
          }

          published_any=false

          # In dependency order. `misorder-cli` depends on `misorder` at this
          # exact version, so the library has to exist first.
          for crate in misorder misorder-cli; do
            if already_published "$crate" "$version"; then
              echo "$crate $version is already published; skipping."
              continue
            fi

            echo "Publishing $crate $version"
            cargo publish --locked --package "$crate"
            wait_until_available "$crate" "$version"

            published_any=true
            echo "Published $crate $version"
          done

          if [ "$published_any" = true ]; then
            echo "### Published \`$version\` to crates.io" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to publish: $version is already on crates.io." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  report:
    name: Report
    runs-on: ubuntu-latest
    needs:
      - prepare
      - merge-manifests
      - publish-crates
    # The publish job is skipped on a pull request, and a skipped dependency
    # would otherwise skip this too.
    if: always() && needs.merge-manifests.result == 'success'
    steps:
      - name: Report
        run: |
          echo "Built image tag: ${{ needs.prepare.outputs.image_tag }}"
